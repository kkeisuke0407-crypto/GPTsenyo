name = "gptsenyo-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`):
#   LINE_CHANNEL_SECRET
#   LINE_CHANNEL_ACCESS_TOKEN
#   OPENAI_API_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET

[vars]
ENVIRONMENT = "development"
LLM_MODEL = "gpt-4o-mini"
FREE_MONTHLY_QUOTA = "3"
LIGHT_MONTHLY_QUOTA = "10"
PUBLIC_BASE_URL = "https://example.com"
LINE_FRIEND_URL = "https://lin.ee/xxxxxxxx"
CONTACT_EMAIL = "support@example.com"
OPERATOR_NAME = "（運営者名・記入してください）"
OPERATOR_ADDRESS = "（運営者所在地・請求があった場合のみ開示）"

# 毎朝 7:00 JST = 22:00 UTC（前日）に星座別運勢をプッシュ
# 毎週月曜 7:00 JST = 月曜 22:00 UTC（前日=日曜の UTC では "1" になる）に有料会員へ週次ダイジェスト
[triggers]
crons = ["0 22 * * *", "0 22 * * 0"]
